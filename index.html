<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ephen's Expert PB Progression</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    #loading {
      font-size: 1.2rem;
      color: #00d2ff;
    }
  </style>
</head>
<body>
  <div id="loading">Loading games.json...</div>
  <div id="chart" style="width:100%; height:750px;"></div>

  <script>
    // Color spectrum mapping (0d -> 20d -> 60d)
    const colorscale = [
      [0.0, '#00d2ff'],   // Fresh: Cyan
      [0.33, '#9b51e0'],  // Mid: Purple
      [1.0, '#a81c40']    // Expiring: Dark Maroon
    ];

    // Pareto Frontier Calculation
    function getFrontier(subData) {
      const sorted = [...subData].sort((a, b) => b.threeBV - a.threeBV || a.time - b.time);
      let minTime = Infinity;
      const frontier = [];
      for (const game of sorted) {
        if (game.time < minTime) {
          frontier.push(game);
          minTime = game.time;
        }
      }
      return frontier.sort((a, b) => a.threeBV - b.threeBV);
    }

    // Fetch and process data client-side
    fetch('games.json')
      .then(res => res.json())
      .then(games => {
        document.getElementById('loading').style.display = 'none';

        // Extract unique dates
        const uniqueDates = [...new Set(games.map(g => g.dateStr))].sort();

        // Build animation frames dynamically in client memory
        const frames = uniqueDates.map(dStr => {
          const currentDate = new Date(dStr);
          const sixtyDaysAgo = new Date(currentDate);
          sixtyDaysAgo.setDate(sixtyDaysAgo.getDate() - 60);

          // Active 60-day window
          const active = games.filter(g => {
            const gDate = new Date(g.dateStr);
            return gDate <= currentDate && gDate >= sixtyDaysAgo;
          });

          // Historical PBs
          const allHistorical = games.filter(g => new Date(g.dateStr) <= currentDate);
          const frontier = getFrontier(allHistorical);

          // Calculate ages & opacities
          const ages = active.map(g => (currentDate - new Date(g.dateStr)) / (1000 * 60 * 60 * 24));
          const opacities = ages.map(age => Math.max(0.05, 0.90 * (1 - Math.pow(age / 60, 1.5))));

          return {
            name: dStr,
            data: [
              // Active decay scatter
              {
                x: active.map(g => g.threeBV),
                y: active.map(g => g.time),
                ids: active.map(g => g.id),
                text: active.map((g, i) => `<b>Date:</b> ${g.dateStr}<br><b>3BV:</b> ${g.threeBV}<br><b>Time:</b> ${g.time}s<br><b>Age:</b> ${ages[i].toFixed(1)}d`),
                hoverinfo: 'text',
                mode: 'markers',
                type: 'scatter',
                showlegend: false,
                marker: {
                  symbol: 'x-thin',
                  size: 5,
                  color: ages,
                  colorscale: colorscale,
                  cmin: 0,
                  cmax: 60,
                  opacity: opacities,
                  colorbar: {
                    title: { text: "Game Age (Days)\n", font: { color: "#e0e0e0" } },
                    tickfont: { color: "#e0e0e0" },
                    tickvals: [0, 20, 40, 60],
                    ticktext: ["0d", "20d", "40d", "60d"],
                    len: 0.75,
                    x: 1.02
                  },
                  line: { width: 1.2, color: ages, colorscale: colorscale, cmin: 0, cmax: 60 }
                }
              },
              // PB Frontier
              {
                x: frontier.map(g => g.threeBV),
                y: frontier.map(g => g.time),
                ids: frontier.map(g => g.id),
                text: frontier.map(g => `<b>PB Date:</b> ${g.dateStr}<br><b>3BV:</b> ${g.threeBV}<br><b>Time:</b> ${g.time}s`),
                hoverinfo: 'text',
                mode: 'lines+markers',
                type: 'scatter',
                name: 'Best Games Frontier',
                line: { color: '#00ff88', width: 2, shape: 'hv' },
                marker: { symbol: 'circle', size: 4, color: '#00ff88' }
              }
            ]
          };
        });

        const layout = {
          paper_bgcolor: '#121212',
          plot_bgcolor: '#1a1a1a',
          font: { color: '#e0e0e0', family: 'Arial, sans-serif' },
          title: 'Expert PB Progression (Last Updated: 17-08-2026)',
          xaxis: { range: [100, 250], title: '3BV', gridcolor: '#2a2a2a', zerolinecolor: '#444' },
          yaxis: { range: [50, 150], title: 'Time (seconds)', gridcolor: '#2a2a2a', zerolinecolor: '#444' },
          legend: { x: 0.05, y: 0.98, font: { color: '#e0e0e0' } },
          sliders: [{
            font: { color: '#e0e0e0' },
            activebgcolor: '#9b51e0',
            currentvalue: { prefix: 'Current Date: ', font: { color: '#e0e0e0' } },
            steps: frames.map(f => ({
              label: f.name,
              method: 'animate',
              args: [[f.name], { mode: 'immediate', frame: { duration: 0, redraw: false } }]
            }))
          }],
          updatemenus: [{
            type: 'buttons',
            showactive: false,
            x: -0.05,
            y: 1,
            buttons: [
              { label: 'Play', method: 'animate', args: [null, { frame: { duration: 90, redraw: true }, transition: { duration: 0 }, fromcurrent: true }] },
              { label: 'Pause', method: 'animate', args: [[null], { mode: 'immediate', frame: { duration: 0, redraw: false } }] }
            ]
          }]
        };

        Plotly.newPlot('chart', frames[0].data, layout).then(() => {
          Plotly.addFrames('chart', frames);
        });
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Error loading games.json file.';
        console.error(err);
      });
  </script>
</body>
</html>
